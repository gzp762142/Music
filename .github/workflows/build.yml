name: Build tipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          rm -rf build Payload
          xcodebuild \
            -project Music.xcodeproj \
            -scheme Music \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package tipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -name 'Music.app' -type d | head -n1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # optional pseudo-sign if ldid exists on runner
          if command -v ldid >/dev/null 2>&1; then
            ldid -S Payload/Music.app || true
          fi
          zip -qry Music.tipa Payload
          ls -la Music.tipa
          unzip -l Music.tipa | head -n 40

      - name: Upload tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-tipa
          path: Music.tipa
          if-no-files-found: error

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Music.tipa
          generate_release_notes: true
