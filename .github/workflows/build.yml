name: Build tipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          set -euo pipefail
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcode-select -p

      - name: Install tools
        run: |
          set -euo pipefail
          brew install xcodegen ldid

      - name: Generate and downgrade pbxproj format
        run: |
          set -euo pipefail
          rm -rf Music.xcodeproj
          xcodegen generate
          PBX=Music.xcodeproj/project.pbxproj
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 60;/' "$PBX"
          sed -i '' -E 's/compatibilityVersion = \"Xcode [0-9.]+\";/compatibilityVersion = "Xcode 14.0";/' "$PBX"
          sed -i '' -E 's/LastUpgradeCheck = [0-9]+;/LastUpgradeCheck = 1540;/' "$PBX"
          OBJ=$(grep -m1 'objectVersion' "$PBX" | tr -dc '0-9')
          echo "objectVersion=$OBJ"
          test "$OBJ" = "60"

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          rm -rf build Payload
          xcodebuild \
            -project Music.xcodeproj \
            -scheme Music \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package tipa with Music.entitlements
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -name 'Music.app' -type d | head -n1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          ENT="$(pwd)/Music.entitlements"
          test -f "$ENT"
          BIN="Payload/Music.app/Music"
          test -f "$BIN"

          echo "Signing Mach-O with: $ENT"
          # Sign the executable (not just the .app dir). -S<path> embeds the plist.
          ldid -S"$ENT" "$BIN"
          echo "ldid sign exit=$?"

          echo "---- embedded entitlements ----"
          # Some brew ldid builds assert on `ldid -e <bundle>`; dump from the binary.
          # Prefer codesign dump; fall back to ldid -e on the binary only.
          DUMP=/tmp/embedded.plist
          if codesign -d --entitlements :- "$BIN" >"$DUMP" 2>/tmp/codesign.err; then
            echo "codesign dump ok"
          else
            echo "codesign dump failed, trying ldid -e on binary"
            cat /tmp/codesign.err || true
            ldid -e "$BIN" >"$DUMP"
          fi
          echo "dump bytes=$(wc -c <"$DUMP")"
          cat "$DUMP"
          grep -q 'com.apple.Music' "$DUMP"
          grep -q 'platform-application' "$DUMP"
          grep -q 'no-sandbox' "$DUMP"
          echo "entitlements OK"

          # App Switcher / multitasking on some iOS builds reads loose
          # AppIcon*.png from the bundle root (same as stock Music.ipa).
          # Asset catalog alone can leave a stale/wrong switcher icon.
          echo "Copying loose AppIcon*.png into app bundle root"
          cp -f Assets.xcassets/AppIcon.appiconset/AppIcon*.png Payload/Music.app/
          ls Payload/Music.app/AppIcon*.png | head

          zip -qry Music.tipa Payload
          ls -la Music.tipa

      - name: Upload tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-tipa
          path: Music.tipa
          if-no-files-found: error

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Music.tipa
          generate_release_notes: true
