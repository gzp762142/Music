name: Build tipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (compatible)
        run: |
          set -euo pipefail
          ls /Applications | grep -i xcode || true
          # Prefer an Xcode that can open objectVersion 60.
          # Avoid selecting a toolchain that *generates* format 77 by accident.
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.2.app ]; then
            # Fallback: Xcode 16 opens format 60 and 77.
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcode-select -p

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          rm -rf Music.xcodeproj
          xcodegen generate
          # Fail fast if generated pbxproj is a future format.
          OBJ=$(grep -m1 'objectVersion' Music.xcodeproj/project.pbxproj | tr -dc '0-9')
          echo "objectVersion=$OBJ"
          if [ -n "$OBJ" ] && [ "$OBJ" -gt 60 ]; then
            echo "Generated objectVersion=$OBJ is too new for Xcode 15.4" >&2
            exit 1
          fi

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          rm -rf build Payload
          xcodebuild \
            -project Music.xcodeproj \
            -scheme Music \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package tipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -name 'Music.app' -type d | head -n1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          if command -v ldid >/dev/null 2>&1; then
            ldid -S Payload/Music.app || true
          fi
          zip -qry Music.tipa Payload
          ls -la Music.tipa
          unzip -l Music.tipa | head -n 40

      - name: Upload tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-tipa
          path: Music.tipa
          if-no-files-found: error

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Music.tipa
          generate_release_notes: true
