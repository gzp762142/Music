name: Music
options:
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
targets:
  Music:
    type: application
    platform: iOS
    sources:
      - path: Aether
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Music
        PRODUCT_MODULE_NAME: Music
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.Music
        MARKETING_VERSION: "1.02"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Music.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  Music:
    build:
      targets:
        Music: all
    run:
      config: Debug
    archive:
      config: Release
